# Production overrides, used together with the main file:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Differences from local:
#   * Caddy in front, with automatic HTTPS (Let's Encrypt) for $SITE_ADDRESS
#   * nothing but Caddy is reachable from outside: databases, API and mock stay private
#   * secrets must come from deploy/.env (see .env.example there); there are no defaults

x-secrets: &secrets
  APP_ENV: production
  LOG_JSON: "true"
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in deploy/.env}
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?set WEBHOOK_SIGNING_SECRET in deploy/.env}
  SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:?set SEED_SUPERADMIN_EMAIL in deploy/.env}
  SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?set SEED_SUPERADMIN_PASSWORD in deploy/.env}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}

  redis:
    ports: !reset []

  migrate:
    environment:
      <<: *secrets
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campaign_manager}

  api:
    ports: !reset []
    environment:
      <<: *secrets
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campaign_manager}

  worker:
    environment:
      <<: *secrets
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campaign_manager}

  mock-sarvam:
    ports: !reset []

  web:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
