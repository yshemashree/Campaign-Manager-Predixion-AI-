name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campaign
          POSTGRES_PASSWORD: campaign
          POSTGRES_DB: campaign_manager
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U campaign" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run alembic upgrade head
      - run: uv run pytest -v

  mock-sarvam:
    name: Mock Sarvam (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock_sarvam
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  frontend:
    name: Web app (type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  stack:
    name: Stack starts with one command and respects limits
    runs-on: ubuntu-latest
    needs: [backend, mock-sarvam, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build -d --wait
      - run: curl -fsS localhost:8000/readyz
      - run: curl -fsS localhost:8080/readyz
      - run: curl -fsS localhost:9000/health
      - name: Run a campaign and check the mock saw the org limits respected
        run: docker compose exec -T api python -m app.tools.prove_limits --contacts 100 --concurrent 10 --cps 4
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
