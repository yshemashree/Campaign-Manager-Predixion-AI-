# Serves the web app and forwards API calls to the API service, so the browser talks to one
# origin (no CORS setup needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Live updates use server-sent events: don't buffer, keep the stream open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
    }

    # Vite puts a content hash in every asset file name, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html and the client-side router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
