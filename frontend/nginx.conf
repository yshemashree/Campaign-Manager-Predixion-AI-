# Serves the web app and forwards API calls to the API service, so the browser talks to one
# origin (no CORS setup needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Live updates use server-sent events: don't buffer, keep the stream open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
    }

    location / {
        try_files $uri /index.html;
    }
}
